# Render blueprint: one free web service built from the root Dockerfile.
# Deploy by connecting this repo at https://dashboard.render.com (New +
# Blueprint), or configure a Docker web service manually with the same values.
services:
  - type: web
    name: eqsolver
    runtime: docker
    plan: free
    # runs one model inference and one sandboxed solve
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Render's proxy adds one X-Forwarded-For hop; trust exactly that one so
      # rate limits apply per client rather than to the proxy
      - key: PROXY_COUNT
        value: "1"
